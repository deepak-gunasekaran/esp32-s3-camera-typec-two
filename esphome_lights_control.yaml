esphome:
  name: esphome-web-c1a4d0
  friendly_name: OV3660 Camera
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    build_flags: "-DBOARD_HAS_PSRAM"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino

# Active Octal PSRAM configuration for the 8MB chip bank
psram:
  mode: octal
  speed: 80MHz

# Verified I2C Engine for the Generic ESP32-S3 Dual Type-C Board
i2c:
  id: i2c_bus
  sda: GPIO4
  scl: GPIO5
  scan: true

# Exact Camera Component Pin Configuration
esp32_camera:
  name: My ESP32-S3 Camera
  id: cam_module
  i2c_id: i2c_bus
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  resolution: 640x480     
  jpeg_quality: 12
  frame_buffer_count: 2

# Web server stream allocations
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# Home Assistant Native API Connection
api:

# Enables Over-The-Air firmware updates through the dashboard/builder
ota:
  - platform: esphome

wifi:
  ssid: "MSV2"
  password: "sumiminivijay"
  ap:
    ssid: "OV3660 Fallback Hotspot"
    password: "Password123"

# Enable logging
logger:
  level: INFO

# 💡 CORRECTED: Binary output channel maps to the high-brightness White Flashlight
output:
  - platform: gpio
    pin: GPIO2  
    id: flash_output

# 🌈 Light Component Definitions
light:
  # 1. Physical White Lens Flashlight Toggle
  - platform: binary
    output: flash_output
    name: "Camera Flashlight"
    id: camera_flashlight_switch
    icon: "mdi:flash"

  # 2. Addressable Color Smart RGB Diode with Expanded Effects Matrix
  - platform: esp32_rmt_led_strip
    pin: GPIO48 
    chipset: WS2812
    rgb_order: GRB
    num_leds: 1
    name: "Camera Status LED"
    id: camera_status_led_rgb
    icon: "mdi:led-strip-variant"
    effects:
      - addressable_rainbow:
          name: "Rainbow Loop"
          speed: 10
      - pulse:
          name: "Breathing Pulse"
          transition_length: 2s
          update_interval: 2s
      - strobe:
          name: "Security Strobe"
          # FIXED: Using a proper color cycle with a matching 'duration' parameter
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 100ms
      - random:
          name: "Slow Color Shift"
          transition_length: 5s
          update_interval: 5s
      - flicker:
          name: "Candle Flicker"
          intensity: 15%
